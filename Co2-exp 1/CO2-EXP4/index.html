<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Result Analysis System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#eaf4ff;
    padding:30px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    color:#0066cc;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:12px;
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #999;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#0066cc;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#004a99;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:25px;
}

table,th,td{
    border:1px solid black;
}

th{
    background:#0066cc;
    color:white;
}

th,td{
    padding:10px;
    text-align:center;
}

.result{
    margin-top:20px;
    font-size:18px;
    font-weight:bold;
    color:green;
}
</style>

</head>
<body>

<div class="container">

<h2>Student Result Analysis System</h2>

<label>Student Name</label>
<input type="text" id="name">

<label>Maths Marks</label>
<input type="number" id="m1">

<label>Science Marks</label>
<input type="number" id="m2">

<label>English Marks</label>
<input type="number" id="m3">

<button onclick="analyzeResult()">Analyze Result</button>

<table id="resultTable" style="display:none;">
<tr>
<th>Student</th>
<th>Total</th>
<th>Average</th>
<th>Highest</th>
<th>Lowest</th>
<th>Grade</th>
</tr>
<tr id="dataRow"></tr>
</table>

<div class="result" id="message"></div>

</div>

<script>

function analyzeResult(){

let student={
name:document.getElementById("name").value,
marks:[
Number(document.getElementById("m1").value),
Number(document.getElementById("m2").value),
Number(document.getElementById("m3").value)
]
};

let total=0;

for(let i=0;i<student.marks.length;i++){
total+=student.marks[i];
}

let average=(total/student.marks.length).toFixed(2);

let highest=Math.max(...student.marks);

let lowest=Math.min(...student.marks);

let grade="";

if(average>=90)
grade="A+";
else if(average>=75)
grade="A";
else if(average>=60)
grade="B";
else if(average>=50)
grade="C";
else
grade="Fail";

document.getElementById("resultTable").style.display="table";

document.getElementById("dataRow").innerHTML=
"<td>"+student.name+"</td>"+
"<td>"+total+"</td>"+
"<td>"+average+"</td>"+
"<td>"+highest+"</td>"+
"<td>"+lowest+"</td>"+
"<td>"+grade+"</td>";

document.getElementById("message").innerHTML=
"Result Analysis Completed Successfully.";

}

</script>

</body>
</html>
