<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#eaf6ff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.profile-card{
    background:white;
    width:700px;
    border:3px solid #0077cc;
    border-radius:15px;
    padding:25px;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

.header{
    text-align:center;
    margin-bottom:20px;
}

.header h1{
    color:#0056b3;
    margin-bottom:10px;
}

.profile{
    display:flex;
    align-items:center;
    gap:25px;
}

.profile img{
    width:180px;
    height:180px;
    border-radius:50%;
    border:5px solid #0077cc;
}

.details{
    flex:1;
}

.details p{
    margin:12px 0;
    font-size:18px;
}

.details span{
    font-weight:bold;
    color:#0056b3;
}

.skills{
    margin-top:25px;
}

.skills h2{
    color:#0056b3;
    margin-bottom:10px;
}

.skills ul{
    margin-left:20px;
}

.skills li{
    margin:8px 0;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#555;
}

/* Hover Effect */
.profile-card:hover{
    transform:scale(1.02);
    transition:0.4s;
}

/* Responsive Design */
@media(max-width:768px){

.profile{
    flex-direction:column;
    text-align:center;
}

.profile img{
    width:150px;
    height:150px;
}

.profile-card{
    width:100%;
}

.details p{
    font-size:16px;
}
}

</style>

</head>
<body>

<div class="profile-card">

<div class="header">
<h1>Student Profile</h1>
</div>

<div class="profile">

<img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Student">

<div class="details">
<p><span>Name:</span> Amirtha Valli</p>
<p><span>Register No:</span> 2212345678</p>
<p><span>Department:</span> Information Technology</p>
<p><span>Year:</span> II Year</p>
<p><span>Email:</span> amirtha@example.com</p>
<p><span>Phone:</span> +91 9876543210</p>
</div>

</div>

<div class="skills">
<h2>Skills</h2>
<ul>
<li>HTML & CSS</li>
<li>JavaScript</li>
<li>Python Programming</li>
<li>React Basics</li>
<li>Problem Solving</li>
</ul>
</div>

<div class="footer">
<p>© 2026 Student Profile Webpage</p>
</div>

</div>

</body>
</html>
