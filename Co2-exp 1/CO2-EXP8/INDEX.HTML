<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Clock & Exam Countdown</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#e8f4ff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:500px;
    background:white;
    padding:30px;
    text-align:center;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}

h1{
    color:#0066cc;
    margin-bottom:20px;
}

.clock{
    font-size:40px;
    font-weight:bold;
    color:#28a745;
    margin:20px 0;
}

.date{
    font-size:20px;
    color:#555;
    margin-bottom:20px;
}

.timer{
    margin-top:20px;
    padding:20px;
    border:2px solid #0066cc;
    border-radius:10px;
    background:#f5faff;
}

.timer h2{
    color:#0066cc;
    margin-bottom:15px;
}

#countdown{
    font-size:28px;
    color:#d32f2f;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="container">

<h1>Digital Clock</h1>

<div class="clock" id="clock"></div>

<div class="date" id="date"></div>

<div class="timer">

<h2>Examination Countdown</h2>

<div id="countdown"></div>

</div>

</div>

<script>

function updateClock(){

let now=new Date();

document.getElementById("clock").innerHTML=
now.toLocaleTimeString();

document.getElementById("date").innerHTML=
now.toDateString();

}

function updateCountdown(){

// Set your exam date here
let examDate=new Date("December 31, 2026 09:00:00");

let now=new Date();

let difference=examDate-now;

if(difference<=0){

document.getElementById("countdown").innerHTML="Exam Started!";

return;

}

let days=Math.floor(difference/(1000*60*60*24));

let hours=Math.floor((difference%(1000*60*60*24))/(1000*60*60));

let minutes=Math.floor((difference%(1000*60*60))/(1000*60));

let seconds=Math.floor((difference%(1000*60))/1000);

document.getElementById("countdown").innerHTML=
days+" Days "
+hours+" Hours "
+minutes+" Minutes "
+seconds+" Seconds";

}

updateClock();
updateCountdown();

setInterval(function(){

updateClock();
updateCountdown();

},1000);

</script>

</body>
</html>
